defaults:
  - data: "sp500-crsp-compustat"
  - preprocessing: "sp500-crsp-compustat"
  - features: "fmg-features"
  - masking: "sp500-membership"
  - loss: "portfolio"
  - model: "fmg-ctct-2"
  - training: "torch"
  - recovery: "off"
  - split: "single_split"
  - experiment: null
  - _self_

experiment_name: ${model.name}
mlflow_tracking_uri: "sqlite:///mlflow.db"

calendar: "XNYS"
missing_threshold: 0.05
membership_columns: ["membership_start", "membership_end"]
trading_year: 252

hydra:
  run:
    dir: hydra/outputs/${experiment_name}/${now:%Y-%m-%d_%H-%M-%S}
  sweep:
    dir: hydra/multirun/${experiment_name}/${now:%Y-%m-%d_%H-%M-%S}
    subdir: ${hydra.job.num}
  job:
    chdir: false
