# @package _global_
defaults:
  - override /model: "rf"
  - override /loss: "portfolio"
  - override /training: "sklearn"
  - override /hyperparameter_selection: "walk-forward"

experiment_name: "rf-baseline"

# Directional single-asset benchmark: gross normalization turns the signed probability score
# into a fully-invested +-1 position (bounded would leave a near-0.5 probability almost flat).
loss:
  normalization: "gross"
