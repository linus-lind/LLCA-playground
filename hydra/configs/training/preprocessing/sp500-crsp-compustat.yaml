daily_values:
  - name: "trading_calendar_filter"
    calendar: "${calendar}"
  - name: "corporate_adjustment"
    price_columns: ["open", "high", "low", "close", "bid", "ask"]
    price_factor: "price_adjustment_factor"
    volume: "volume"
    shares_outstanding: "shares_outstanding"
    share_factor: "share_adjustment_factor"
  - name: "deduplicate"
  - name: "consistency_check"
    constraints:
      - name: "positive"
        expressions:
          - left: ["open", "high", "low", "close", "shares_outstanding"]
            op: "gt"
            right: 0
        invalidate: "left"
      - name: "non_negative"
        expressions:
          - left: ["volume"]
            op: "ge"
            right: 0
        invalidate: "left"
      - name: "positive_quotes"
        expressions:
          - left: ["bid", "ask"]
            op: "gt"
            right: 0
        invalidate: "left"
      - name: "quote_order"
        expressions:
          - { left: "ask", op: "ge", right: "bid" }
        invalidate: ["bid", "ask"]
      - name: "ohlc_order"
        expressions:
          - { left: "high", op: "ge", right: "low" }
          - { left: "high", op: "ge", right: "open" }
          - { left: "high", op: "ge", right: "close" }
          - { left: "low", op: "le", right: "open" }
          - { left: "low", op: "le", right: "close" }
        invalidate: ["open", "high", "low", "close"]
  - name: "impute"
    ffill: ["open", "high", "low", "close", "bid", "ask", "shares_outstanding"]
    fill_zero: ["volume"]
    subgroup_keys: ["membership_start", "membership_end"]
  - name: "consistency_check"
    constraints:
      - name: "ohlc_order"
        expressions:
          - { left: "high", op: "ge", right: "low" }
          - { left: "high", op: "ge", right: "open" }
          - { left: "high", op: "ge", right: "close" }
          - { left: "low", op: "le", right: "open" }
          - { left: "low", op: "le", right: "close" }
        invalidate: ["open", "high", "low", "close"]
      - name: "quote_order"
        expressions:
          - { left: "ask", op: "ge", right: "bid" }
        invalidate: ["bid", "ask"]

firm_characteristics:
  - name: "deduplicate"
  - name: "consistency_check"
    constraints:
      - name: "positive"
        expressions:
          - left: [
              "total_assets_quarterly",
              "total_assets_annual"
            ]
            op: "gt"
            right: 0
        invalidate: "left"
      - name: "non_negative"
        expressions:
          - left: [
              "current_assets_quarterly",
              "cash_short_term_investments_quarterly",
              "cost_of_goods_sold_quarterly",
              "long_term_debt_quarterly",
              "inventories_quarterly",
              "current_liabilities_quarterly",
              "total_liabilities_quarterly",
              "total_receivables_quarterly",
              "net_sales_quarterly",
              "research_development_expense_quarterly",
              "selling_general_admin_expense_quarterly",
              "capital_expenditures_annual",
              "common_dividends_annual",
              "interest_expense_total_annual"
            ]
            op: "ge"
            right: 0
        invalidate: "left"
  - name: "impute"
    fill_zero: [
      "research_development_expense_quarterly"
    ]

macro:
  - name: "trading_calendar_filter"
    calendar: "${calendar}"
  - name: "deduplicate"
  - name: "consistency_check"
    constraints:
      - name: "positive"
        expressions:
          - left: ["sp500_price_index", "dxy", "umich_consumer_sentiment", "cpi", "us_personal_consumption", "nonfarm_employment", "move", "vix"]
            op: "gt"
            right: 0
        invalidate: "left"
      - name: "non_negative"
        expressions:
          - left: ["fed_total_assets", "aaii_bullish", "aaii_bearish", "nyse_declining_volume", "nyse_advancing_volume"]
            op: "ge"
            right: 0
        invalidate: "left"
      - name: "sentiment_percentage_upper_bound"
        expressions:
          - left: ["aaii_bullish", "aaii_bearish"]
            op: "lt"
            right: 100
        invalidate: "left"
  - name: "missing_threshold_filter"
    threshold: 0.05
    columns: [
      "sp500_price_index",
      "nfci",
      "nfci_adjusted",
      "stl_fin_stress_index",
      "dxy",
      "fed_total_assets",
      "aaii_bullish",
      "aaii_bearish",
      "umich_consumer_sentiment",
      "nyse_declining_volume",
      "nyse_advancing_volume",
      "cpi",
      "us_personal_consumption",
      "nonfarm_employment",
      "tips_10y_yield",
      "baa10y_spread",
      "move",
      "vix"
    ]
  - name: "impute"
    ffill: [
      "sp500_price_index",
      "dxy",
      "fed_total_assets",
      "cpi",
      "us_personal_consumption",
      "nonfarm_employment"
    ]

loss:
  - name: "trading_calendar_filter"
    calendar: "${calendar}"
  - name: "corporate_adjustment"
    price_columns: ["close"]
    price_factor: "price_adjustment_factor"
  - name: "deduplicate"
  - name: "consistency_check"
    constraints:
      - name: "positive"
        expressions:
          - left: ["close"]
            op: "gt"
            right: 0
        invalidate: "left"
  - name: "impute"
    ffill: ["close"]

risk_free:
  - name: "trading_calendar_filter"
    calendar: "${calendar}"
  - name: "deduplicate"
