name: "torch"
seed: 42
deterministic: true
epochs: 500
batch_size: 128
grad_clip: 1.0
device: "auto"
precision: "bf16"
gradient_checkpointing: true

optimizer:
  name: "adamw"
  learning_rate: 0.0001
  weight_decay: 0.0
  fused: true

early_stopping:
  patience: 100
  min_delta: 0.00001

diagnostics:
  interval: 10
  component_gradient_norms: true
  parameter_update_norms: true
