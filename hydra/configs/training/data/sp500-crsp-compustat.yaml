name: "sp500-crsp-compustat"
selection:
  entity_ids: null
  csv_chunk_size: 250000
cache:
  enabled: true
  directory: ".cache/llca/data"

index:
  time: "date"
  entity: "instrument_id"
datasets:
  daily_values:
    path: "sp500_constituents/daily/daily_values.csv"
    kind: "panel"
    frequency: "daily"
    date_format: "%d/%m/%Y"
    index:
      date: { raw: "DlyCalDt", dtype: "date"}
      instrument_id: "PERMNO"
    columns:
      open: "DlyOpen"
      high: "DlyHigh"
      low: "DlyLow"
      close: "DlyClose"
      bid: "DlyBid"
      ask: "DlyAsk"
      volume: "DlyVol"
      shares_outstanding: "ShrOut"
    auxiliary:
      price_adjustment_factor: "DlyCumFacPr"
      share_adjustment_factor: "DlyCumFacShr"
      membership_start: { raw: "MbrStartDt", dtype: "date" }
      membership_end: { raw: "MbrEndDt", dtype: "date" }
  firm_characteristics:
    path: "sp500_constituents/fundamentals/fundamentals.csv"
    kind: "panel"
    frequency: "point_in_time"
    date_format: "%d/%m/%Y"
    index:
      date: { raw: "date", dtype: "date" }
      instrument_id: "permno"
    columns:
      current_assets_quarterly: "ACTQ"
      total_assets_quarterly: "ATQ"
      common_equity_quarterly: "CEQQ"
      cash_short_term_investments_quarterly: "CHEQ"
      cost_of_goods_sold_quarterly: "COGSQ"
      long_term_debt_quarterly: "DLTTQ"
      inventories_quarterly: "INVTQ"
      current_liabilities_quarterly: "LCTQ"
      total_liabilities_quarterly: "LTQ"
      net_income_quarterly: "NIQ"
      operating_income_after_depreciation_quarterly: "OIADPQ"
      total_receivables_quarterly: "RECTQ"
      net_sales_quarterly: "SALEQ"
      research_development_expense_quarterly: "XRDQ"
      selling_general_admin_expense_quarterly: "XSGAQ"
      total_assets_annual: "AT"
      capital_expenditures_annual: "CAPX"
      common_dividends_annual: "DVC"
      net_income_annual: "NI"
      operating_income_after_depreciation_annual: "OIADP"
      interest_expense_total_annual: "XINT"
  macro:
    path: "macro/macro.csv"
    kind: "context"
    frequency: "daily"
    date_format: "%d.%m.%Y"
    index:
      date: { raw: "date", dtype: "date" }
    columns:
      sp500_price_index: "sp500_price_index"
      nfci: "nfci"
      nfci_adjusted: "anfci"
      stl_fin_stress_index: "stl_fin_stress_index"
      dxy: "dxy"
      fed_total_assets: "fed_total_assets"
      aaii_bullish: "aaii_bullish"
      aaii_bearish: "aaii_bearish"
      umich_consumer_sentiment: "umich_consumer_sentiment"
      nyse_declining_volume: "nyse_declining_volume"
      nyse_advancing_volume: "nyse_advancing_volume"
      cpi: "cpi"
      us_personal_consumption: "us_personal_consumption"
      nonfarm_employment: "nonfarm_employment"
      tips_10y_yield: "tips_10y_yield"
      baa10y_spread: "baa10y_spread"
      move: "move"
      vix: "vix"
  loss:
    path: "sp500_constituents/daily/daily_values.csv"
    kind: "panel"
    frequency: "daily"
    date_format: "%d/%m/%Y"
    index:
      date: "DlyCalDt"
      instrument_id: "PERMNO"
    columns:
      close: "DlyClose"
    auxiliary:
      price_adjustment_factor: "DlyCumFacPr"
  risk_free:
    path: "fama-french/fama-french.csv"
    kind: "context"
    frequency: "daily"
    date_format: "%d/%m/%Y"
    index:
      date: { raw: "date", dtype: "date" }
    columns:
      rf: "rf"
