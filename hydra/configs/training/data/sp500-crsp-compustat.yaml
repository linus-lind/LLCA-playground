name: "sp500-crsp-compustat"
selection:
  # Null lets the model capability choose the complete universe or its target entity.
  entity_ids: null
  csv_chunk_size: 250000
cache:
  enabled: true
  directory: ".cache/llca/data"

index:
  time: "date"
  entity: "instrument_id"
datasets:
  # Lightweight, execution-aligned return view used by the independent IPCA
  # reference pipeline.  Keeping this separate from ``daily_values`` avoids
  # loading quote/volume columns that are irrelevant for factor estimation.
  asset_returns:
    path: "sp500_constituents/daily/daily_values.csv"
    kind: "panel"
    frequency: "daily"
    date_format: "%d/%m/%Y"
    index:
      date: { raw: "DlyCalDt", dtype: "date" }
      instrument_id: "PERMNO"
    columns:
      open: "DlyOpen"
    auxiliary:
      price_adjustment_factor: "DlyCumFacPr"
      membership_start: { raw: "MbrStartDt", dtype: "date" }
      membership_end: { raw: "MbrEndDt", dtype: "date" }
  # Daily traded factor returns and risk-free return used by FF6, conditional
  # timing, spanning, and all excess-return statistics.
  fama_french:
    path: "fama-french/fama-french.csv"
    kind: "context"
    frequency: "daily"
    date_format: "%d/%m/%Y"
    index:
      date: { raw: "date", dtype: "date" }
    columns:
      mktrf: "mktrf"
      smb: "smb"
      hml: "hml"
      rmw: "rmw"
      cma: "cma"
      rf: "rf"
      umd: "umd"
  daily_values:
    path: "sp500_constituents/daily/daily_values.csv"
    kind: "panel"
    frequency: "daily"
    date_format: "%d/%m/%Y"
    index:
      date: { raw: "DlyCalDt", dtype: "date"}
      instrument_id: "PERMNO"
    columns:
      open: "DlyOpen"
      high: "DlyHigh"
      low: "DlyLow"
      close: "DlyClose"
      bid: "DlyBid"
      ask: "DlyAsk"
      volume: "DlyVol"
      shares_outstanding: "ShrOut"
    auxiliary:
      price_adjustment_factor: "DlyCumFacPr"
      share_adjustment_factor: "DlyCumFacShr"
      membership_start: { raw: "MbrStartDt", dtype: "date" }
      membership_end: { raw: "MbrEndDt", dtype: "date" }
  firm_characteristics:
    path: "sp500_constituents/fundamentals/fundamentals.csv"
    kind: "panel"
    frequency: "point_in_time"
    index:
      date: { raw: "date", dtype: "date" }
      instrument_id: "permno"
    auxiliary:
      # Used only for point-in-time diagnostics.  ``date`` remains the
      # availability timestamp; ``datadate`` is the fiscal period end.
      fiscal_period_end: { raw: "datadate", dtype: "date" }
    columns:
      current_assets_quarterly: "actq"
      accounts_payable_quarterly: "apq"
      total_assets_quarterly: "atq"
      common_equity_quarterly: "ceqq"
      cash_short_term_investments_quarterly: "cheq"
      cost_of_goods_sold_quarterly: "cogsq"
      common_shares_outstanding_quarterly: "cshoq"
      debt_in_current_liabilities_quarterly: "dlcq"
      long_term_debt_quarterly: "dlttq"
      depreciation_amortization_quarterly: "dpq"
      income_before_extraordinary_items_quarterly: "ibq"
      inventories_quarterly: "invtq"
