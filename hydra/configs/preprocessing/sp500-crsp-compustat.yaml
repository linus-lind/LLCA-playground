daily_values:
  - name: "trading_calendar_filter"
    calendar: "${calendar}"
  - name: "corporate_adjustment"
    price_columns: ["open", "high", "low", "close"]
    price_factor: "price_adjustment_factor"
    volume: "volume"
    shares_outstanding: "shares_outstanding"
    share_factor: "share_adjustment_factor"
  - name: "deduplicate"
  - name: "consistency_check"
    constraints:
      - name: "positive"
        expressions:
          - left: ["open", "high", "low", "close", "shares_outstanding"]
            op: "gt"
            right: 0
        invalidate: "left"
      - name: "non_negative"
        expressions:
          - left: ["volume"]
            op: "ge"
            right: 0
        invalidate: "left"
      - name: "ohlc_order"
        expressions:
          - { left: "high", op: "ge", right: "low" }
          - { left: "high", op: "ge", right: "open" }
          - { left: "high", op: "ge", right: "close" }
          - { left: "low", op: "le", right: "open" }
          - { left: "low", op: "le", right: "close" }
        invalidate: ["open", "high", "low", "close"]
  - name: "impute"
    ffill: ["open", "high", "low", "close", "shares_outstanding"]
    fill_zero: ["volume"]
    subgroup_keys: "${membership_columns}"
  - name: "consistency_check"
    constraints:
      - name: "ohlc_order"
        expressions:
          - { left: "high", op: "ge", right: "low" }
          - { left: "high", op: "ge", right: "open" }
          - { left: "high", op: "ge", right: "close" }
          - { left: "low", op: "le", right: "open" }
          - { left: "low", op: "le", right: "close" }
        invalidate: ["open", "high", "low", "close"]

