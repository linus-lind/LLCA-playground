macro:
  - name: "trading_calendar_filter"
    calendar: "${calendar}"
  - name: "deduplicate"
  - name: "consistency_check"
    constraints:
      - name: "positive"
        expressions:
          - left: ["sp500_price_index", "dxy", "umich_consumer_sentiment", "cpi", "us_personal_consumption", "nonfarm_employment", "move", "vix"]
            op: "gt"
            right: 0
        invalidate: "left"
      - name: "non_negative"
        expressions:
          - left: ["fed_total_assets", "aaii_bullish", "aaii_bearish", "nyse_declining_volume", "nyse_advancing_volume"]
            op: "ge"
            right: 0
        invalidate: "left"
      - name: "sentiment_percentage_upper_bound"
        expressions:
          - left: ["aaii_bullish", "aaii_bearish"]
            op: "lt"
            right: 100
        invalidate: "left"
  - name: "missing_threshold_filter"
    threshold: "${missing_threshold}"
    columns: [
      "sp500_price_index",
      "nfci",
      "nfci_adjusted",
      "stl_fin_stress_index",
      "dxy",
      "fed_total_assets",
      "aaii_bullish",
      "aaii_bearish",
      "umich_consumer_sentiment",
      "nyse_declining_volume",
      "nyse_advancing_volume",
      "cpi",
      "us_personal_consumption",
      "nonfarm_employment",
      "tips_10y_yield",
      "baa10y_spread",
      "move",
      "vix"
    ]
  - name: "impute"
    ffill: [
      "sp500_price_index",
      "nfci",
      "nfci_adjusted",
      "stl_fin_stress_index",
      "dxy",
      "fed_total_assets",
      "aaii_bullish",
      "aaii_bearish",
      "umich_consumer_sentiment",
      "cpi",
      "us_personal_consumption",
      "nonfarm_employment",
      "tips_10y_yield",
      "baa10y_spread",
      "move",
      "vix"
    ]

loss:
  - name: "trading_calendar_filter"
    calendar: "${calendar}"
  - name: "corporate_adjustment"
    price_columns: ["open"]
    price_factor: "price_adjustment_factor"
  - name: "deduplicate"
  - name: "consistency_check"
    constraints:
      - name: "positive"
        expressions:
          - left: ["open"]
            op: "gt"
            right: 0
        invalidate: "left"
  - name: "impute"
    ffill: ["open"]
