[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llca-playground"
version = "0.0.1"
description = "Playground"
requires-python = ">=3.13,<3.14"
authors = [{ name = "Linus Lindemann" }]

dependencies = [
    "numpy>=2.0.0",
    "pandas>=2.2.0",
    "pandas-stubs>=2.2.0",
    "pyyaml>=6.0",
    "types-pyyaml>=6.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "pre-commit>=3.5.0",
    "matplotlib>=3.8.0",
    "scikit-learn>=1.4.0",
    "scipy>=1.12.0",
    "torch>=2.2.0",
    "mlflow>=2.14.0",
    "python-dotenv>=1.0.0",
    "dvc>=3.50.0",
    "hydra-core>=1.3.0",
    "exchange-calendars>=4.0",
    "shap>=0.45.0",
    "lime>=0.2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/llca"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["mlflow.*"]
ignore_missing_imports = true
follow_imports = "skip"

[[tool.mypy.overrides]]
module = ["exchange_calendars.*"]
ignore_missing_imports = true
